/* Neon family (kawaii) look, like Neon Chef */
body{background:#dde4ff repeating-conic-gradient(#cfd9ff 0 25%,#eaeeff 0 50%) 0 0/36px 36px!important;margin:0}
.game-wrap{padding:10px}
.neon-game{--cyan:#1f9d7a;--pink:#5b6cff;--violet:#8a6bd8;background:linear-gradient(180deg,#f5f6ff,#e8eaff 70%,#e0f8ec)!important;color:#2e2a6b!important;border:3px solid #2e2a6b;border-radius:26px!important;box-shadow:0 6px 0 #2e2a6b,0 0 26px #7a8cff55;display:grid;grid-template-columns:78px 1fr;column-gap:12px;align-content:start}
.neon-game>*{grid-column:1/-1;min-width:0}
.neon-game>.avatar-builder{grid-column:1;grid-row:1}.neon-game>.namebox{grid-column:2;grid-row:1}
.neon-game *{text-shadow:none}
.neon-game h1{color:#6a7cff!important;text-shadow:3px 3px 0 #2e2a6b!important;letter-spacing:1px!important;text-align:center}
.neon-game header p{color:#8a6bd8!important}
.neon-game h2,.neon-game h3,legend{color:#2e2a6b!important}
.neon-game p{color:#55558f}
.hint{color:#7f82b5!important}.eyebrow{color:#8a6bd8!important}
.neon-game button{background:#fff!important;color:#2e2a6b!important;border:3px solid #2e2a6b!important;border-radius:16px!important;box-shadow:0 3px 0 #2e2a6b;transition:transform .08s}
@media(hover:hover) and (pointer:fine){.neon-game button:hover:not(:disabled){background:#eef0ff!important;border-color:#2e2a6b!important}}
.neon-game button:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 #2e2a6b}
.neon-game button.selected{background:#b7f0d3!important;color:#2e2a6b!important;box-shadow:0 3px 0 #2e2a6b,0 0 0 3px #7a8cff!important}
.neon-game button.launch{background:#7a8cff!important;color:#fff!important;border-color:#2e2a6b!important;box-shadow:0 5px 0 #2e2a6b!important;font-size:16px}
@media(hover:hover) and (pointer:fine){.neon-game button.launch:hover{background:#93a1ff!important}}
.chips span{background:#fff;border:2px solid #2e2a6b!important;color:#2e2a6b!important;border-radius:14px}
.intro{display:block!important;margin-bottom:14px!important;background:#fff;border:3px solid #2e2a6b;border-radius:20px;padding:12px 14px;box-shadow:0 4px 0 #2e2a6b}.intro img{display:none}.intro h2{font-size:22px!important;margin:4px 0 8px!important}.intro p{font-size:13px!important;margin:0}
.namebox{margin:0!important;align-self:center}.namebox label{display:none}.greet{font-size:20px!important;font-weight:800;color:#2e2a6b!important;margin:0 0 8px!important;line-height:1.2}
.paedit{display:inline-block;padding:8px 12px;border:3px solid #2e2a6b;border-radius:16px;background:#7a8cff;color:#fff!important;font-weight:800;text-decoration:none;box-shadow:0 3px 0 #2e2a6b;font-size:13px}
.avatar-builder{margin:0!important}.avatar-builder{background:none!important;border:0!important;padding:0!important}.avatar-preview{background:#fff!important;border:3px solid #2e2a6b;border-radius:20px;padding:4px;box-shadow:0 3px 0 #2e2a6b;display:flex;justify-content:center}.avatar-preview svg,.avatar-preview>div{display:none!important}.avatar-preview canvas{width:62px;height:auto;image-rendering:pixelated;display:block}
.neon-game header{grid-row:2;margin:14px 0 12px!important}
.bird-cell{background:#fff!important;border:2px solid #2e2a6b!important;border-radius:14px!important;color:#55558f!important}
.bird-cell.active{box-shadow:0 0 0 3px #7a8cff!important}.bird-cell svg{filter:none!important}
.saved{background:#d3f6e6!important;color:#1b7a60!important;border-color:#1b7a60!important}.locked,.timeout{background:#ffe4ec!important;color:#c23a5a!important;border-color:#c23a5a!important}
.bars{stroke:#8a6bd8}.eye{fill:#3b2250}
.question-panel{background:#fff!important;border:3px solid #2e2a6b!important;border-radius:22px!important;box-shadow:0 4px 0 #2e2a6b}
.timer-label{color:#55558f!important}.timer-label strong{color:#1f9d7a}.time-track{background:#dde1ff!important}
.equation{color:#2e2a6b!important}.equation span{color:#5b6cff!important}
.answers button.correct{background:#c8f5df!important;color:#1b7a60!important}.answers button.incorrect{background:#ffd0dc!important;color:#c23a5a!important}
.answers small{color:#7f82b5!important}
.typed input{background:#fff!important;color:#2e2a6b!important;border:3px solid #2e2a6b!important;border-radius:14px!important}
.typed button{background:#7a8cff!important;color:#fff!important}
.auto-next{background:#eaf8f5!important;border:2px solid #2e2a6b!important;border-radius:14px!important;color:#1b7a60!important}
.lock-stage svg{fill:#efe6ff!important}.key-number{border-radius:8px}
.review,.review>div{border-color:#d6dbf5!important}
.neon-game footer{border-top:2px dashed #bfc6f0!important}.neon-game footer span,.neon-game [class*=closing]{color:#7f82b5!important}
.leaderboard{background:#fff;border:3px solid #2e2a6b;border-radius:20px;padding:14px;margin-top:18px;box-shadow:0 4px 0 #2e2a6b}
.report h2{color:#5b6cff!important}
.neon-game button small{color:#7f82b5!important}.neon-game button.selected small{color:#55558f!important}.avatar-builder>.avatar-preview{background:#fff!important}
.pxback{display:block;box-sizing:border-box;margin:10px 10px 0;padding:10px 14px;border:3px solid #2e2a6b;border-radius:18px;background:#7a8cff;color:#fff;font:800 15px system-ui,Arial,sans-serif;text-decoration:none;text-align:center;box-shadow:0 4px 0 #2e2a6b;max-width:860px;margin-left:auto;margin-right:auto}
.answers button.correct,.saved{background:#c4f5de!important}.neon-game button.selected{box-shadow:0 3px 0 #2e2a6b,0 0 0 3px #6fe0b0!important}.bird-cell.active{box-shadow:0 0 0 3px #6fe0b0!important}.equation span{color:#1f9d7a!important}.time-track div{background:#3ec99a!important}.time-track .urgent{background:#e0507a!important}
.avatar-face{image-rendering:pixelated;width:84px!important;height:auto!important}.lock-stage svg{width:48px!important;height:auto!important;fill:none!important;stroke:none!important}.bird-cell svg{filter:none!important}

/* compact top */
.intro{padding:10px 14px!important;margin:0 0 8px!important}
.intro h2,.intro .chips{display:none!important}
.intro .eyebrow{margin-bottom:2px!important}
.intro p{margin:0!important;font-size:13px!important;line-height:1.35!important}
.greet{font-size:15px!important;margin:0!important;line-height:1.25!important}
.paedit{margin-top:4px!important;padding:5px 10px!important;font-size:12px!important}
h1{font-size:30px!important;margin:6px 0 2px!important}
